<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GitHub Profile Card</title>
  <link rel="stylesheet" href="./index.css" />
</head>
<body>
  <div class="container">
    <input type="text" id="search" placeholder="Enter GitHub Username..." />
    <button onclick="getUser()">Search</button>

    <div id="card" class="card hidden">
      <img id="avatar" class="avatar" src="" alt="Profile Picture" />
      <h2 id="name">Name</h2>
      <p id="username">@username</p>
      <p id="bio">Bio</p>
      <div class="stats">
        <div><strong id="repos">0</strong><span>Repos</span></div>
        <div><strong id="followers">0</strong><span>Followers</span></div>
        <div><strong id="following">0</strong><span>Following</span></div>
      </div>
    </div>
  </div>

  <script src="./index.js"></script>
</body>
</html>
