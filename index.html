<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Circular Image Slider</title>
  <link rel="stylesheet" href="./index.css">
  <script defer src="./index.js"></script>
</head>
<body>

<div class="slider" id="slider">
  <img src="https://picsum.photos/id/1015/600/400" class="active" />
  <img src="https://picsum.photos/id/1016/600/400" />
  <img src="https://picsum.photos/id/1025/600/400" />
  <img src="https://picsum.photos/id/1035/600/400" />
  
  <div class="buttons">
    <button onclick="prevImage()">Previous</button>
    <button onclick="nextImage()">Next</button>
  </div>
</div>



</body>
</html>
